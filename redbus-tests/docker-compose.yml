version: '3.8'

services:
  redbus-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redbus_playwright_container
    ipc: host
    environment:
      - CI=true
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
    command: npx playwright test
